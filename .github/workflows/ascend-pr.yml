name: Ascend-PR-CI
run-name: Ascend-PR-CI ${{ github.event.pull_request.number && format('#{0}', github.event.pull_request.number) || github.ref_name }}

# One entry point for both PR and nightly scope.
#
#   lint -> Planner -> PlanArtifact -> Executor matrix -> JobResult -> Gate
#
# PR runs all core pytest plus two model guards. Nightly runs every pytest suite
# and every E2E case. The workflow only moves artifacts; selection lives in
# scripts/ci/policies.yml and execution lives in scripts/ci/executor.py.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_call:
    inputs:
      mode:
        required: false
        default: 'pr'
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: 'pr = core pytest + model guards; full = nightly scope'
        required: true
        default: 'pr'
        type: choice
        options:
          - pr
          - full

concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('full-{0}', github.run_id) }}${{ startsWith(github.event.label.name || '', 'ci:manual:') && '-manual-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  # run_tests.sh treats MODE as cpu/npu, so keep this variable name distinct.
  CI_MODE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.mode }}

jobs:
  plan:
    name: Ascend-PR-Plan
    if: ${{ !startsWith(github.event.label.name || '', 'ci:manual:') }}
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 20
    outputs:
      cpu_jobs: ${{ steps.plan.outputs.cpu_jobs || '[]' }}
      cpu_job_count: ${{ steps.plan.outputs.cpu_job_count || '0' }}
      npu_jobs: ${{ steps.plan.outputs.npu_jobs || '[]' }}
      npu_job_count: ${{ steps.plan.outputs.npu_job_count || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: lint
        id: lint
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -uo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            -r requirements-lint.txt
          python3 scripts/ci/lint_select/lint_check.py

      - name: resolve image
        id: image
        if: always()
        env:
          OVERRIDE: ${{ vars.BASE_IMAGE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF=$(python3 scripts/ci/image/build_image.py resolve --override "$OVERRIDE" \
            --repo "$GITHUB_REPOSITORY" \
            --fallback 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest')
          test -n "$REF"
          echo "image=$REF" >> "$GITHUB_OUTPUT"
          echo "image: $REF"

      # Always publish a PlanArtifact, including lint/image failures. Gate is a
      # consumer of contracts, not of shell exit codes.
      - name: plan
        id: plan
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
          IMAGE_REF: ${{ steps.image.outputs.image }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/ci-plan"
          POLICY=pull_request
          if [ "$CI_MODE" = full ]; then POLICY=nightly; fi
          COMMON=(
            --root "$GITHUB_WORKSPACE"
            --policy "$POLICY"
            --output "$RUNNER_TEMP/ci-plan/plan.json"
            --source-repository "$GITHUB_REPOSITORY"
            --source-ref "$GITHUB_REF"
            --source-sha "$GITHUB_SHA"
          )
          if [ "$LINT_OUTCOME" != success ]; then
            python3 scripts/ci/planner.py "${COMMON[@]}" \
              --fail-code lint --fail-path scripts/ci/lint_select/lint_check.py \
              --fail-message "lint failed"
            exit 1
          fi
          if [ "$IMAGE_OUTCOME" != success ]; then
            python3 scripts/ci/planner.py "${COMMON[@]}" \
              --fail-code image-resolve --fail-path scripts/ci/image/build_image.py \
              --fail-message "image resolution failed"
            exit 1
          fi
          MATRIX_OUTPUT="$RUNNER_TEMP/matrix-output"
          if ! python3 scripts/ci/planner.py "${COMMON[@]}" \
            --image-ref "npu-default=$IMAGE_REF" \
            --github-output "$MATRIX_OUTPUT"; then
            exit 1
          fi
          echo "Planner matrix outputs:"
          cat "$MATRIX_OUTPUT"
          cat "$MATRIX_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: upload plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
          if-no-files-found: warn
          retention-days: 7

  cpu:
    name: Ascend-PR-CPU (${{ matrix.job_id }})
    needs: plan
    if: |
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.cpu_job_count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cpu_jobs) }}
    runs-on: ${{ vars[matrix.runner_variable] || matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/ci/catalog.yml
            scripts/ci/envs/*.txt

      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: execute
        env:
          RUNNER_LABEL: ${{ vars[matrix.runner_variable] || matrix.runner }}
          CI_VENV_ROOT: ${{ runner.temp }}/turbo-ci-venv
        run: |
          python3 scripts/ci/executor.py \
            --plan "$RUNNER_TEMP/ci-plan/plan.json" \
            --job-id "${{ matrix.job_id }}" \
            --output "$RUNNER_TEMP/ci-result/job-result.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-${{ matrix.job_id }}
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: warn
          retention-days: 7

  npu:
    name: Ascend-PR-NPU (${{ matrix.job_id }})
    needs: plan
    if: |
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.npu_job_count != '0' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.npu_jobs) }}
    runs-on: ${{ vars[matrix.runner_variable] || matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    container:
      image: ${{ matrix.image_ref }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: execute
        env:
          RUNNER_LABEL: ${{ vars[matrix.runner_variable] || matrix.runner }}
          CI_VENV_ROOT: /tmp/turbo-ci-venv
        run: |
          python3 scripts/ci/executor.py \
            --plan "$RUNNER_TEMP/ci-plan/plan.json" \
            --job-id "${{ matrix.job_id }}" \
            --output "$RUNNER_TEMP/ci-result/job-result.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-${{ matrix.job_id }}
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: warn
          retention-days: 7

  # Fork PRs cannot receive SWR secrets. Emit the same typed JobResults as a
  # normal run so Gate can distinguish an allowed platform skip from a lost job.
  npu_fork_skip:
    name: Ascend-PR-NPU-Skip (${{ matrix.job_id }})
    needs: plan
    if: |
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.npu_job_count != '0' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.npu_jobs) }}
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: record skip
        run: |
          python3 scripts/ci/executor.py \
            --plan "$RUNNER_TEMP/ci-plan/plan.json" \
            --job-id "${{ matrix.job_id }}" \
            --record-skip fork-pr-no-secrets \
            --skip-message "fork PR has no SWR secrets" \
            --output "$RUNNER_TEMP/ci-result/job-result.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-${{ matrix.job_id }}
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: Ascend-PR-Gate
    needs: [plan, cpu, npu, npu_fork_skip]
    if: ${{ always() && !startsWith(github.event.label.name || '', 'ci:manual:') }}
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: download plan
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan

      - name: download results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ci-result-*
          path: ${{ runner.temp }}/ci-results

      - name: timing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/report/report_gate.py timing

      - name: judge
        env:
          PLAN: ${{ runner.temp }}/ci-plan/plan.json
          RESULTS: ${{ runner.temp }}/ci-results
          DECISION: ${{ runner.temp }}/ci-decision/decision.json
        run: |
          set -uo pipefail
          mkdir -p "$RESULTS" "$(dirname "$DECISION")"
          if [ ! -f "$PLAN" ]; then
            echo "::error::missing ci-plan artifact"
            printf '## CI Gate: failed\n\n- missing-plan: ci-plan artifact is missing\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          python3 scripts/ci/gate.py \
            --plan "$PLAN" \
            --results "$RESULTS" \
            --output "$DECISION" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: upload decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-decision
          path: ${{ runner.temp }}/ci-decision
          if-no-files-found: ignore
          retention-days: 7
