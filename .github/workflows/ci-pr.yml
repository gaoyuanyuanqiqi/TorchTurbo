name: CI

# Sole entry point: mode=pr (gate a PR on the diff) or mode=full.
# Lanes are inlined -- a `uses:` job renders as "caller / callee" on the graph.
# l1_/l2_/l3_ prefixes pin the order (jobs sort by key, not by position).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      mode:
        description: 'pr = select from the diff, full = run everything'
        required: true
        default: 'pr'
        type: choice
        options:
          - pr
          - full
      force_all:
        description: 'pr only: run everything (same as the ci:full label)'
        required: false
        default: false
        type: boolean
      with_e2e:
        description: 'pr: one cheapest profile; full: every profile'
        required: false
        default: false
        type: boolean
      test_path:
        description: "unit lanes only: dir / file / node id; '-' = normal selection"
        required: false
        default: '-'
        type: string

# A shared group with cancel-in-progress: false still cancels *pending* jobs and
# once wedged this queue. So: PRs cancel per PR, full runs never queue.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('full-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  actions: read          # gate timing reads created_at / run_started_at

env:
  # Not MODE: run_tests.sh reads MODE as cpu/npu.
  CI_MODE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.mode }}

jobs:
  select:
    name: Lint_Select
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 20
    outputs:
      e2e: ${{ steps.pick.outputs.e2e }}
      stage: ${{ steps.stage.outputs.stage }}
      cpu_unit_run: ${{ steps.pick.outputs.cpu_unit_run }}
      npu_unit_run: ${{ steps.pick.outputs.npu_unit_run }}
      npu_model_run: ${{ steps.pick.outputs.npu_model_run }}
      cpu_unit_files: ${{ steps.pick.outputs.cpu_unit_files }}
      image: ${{ steps.image.outputs.image }}
      summary: ${{ steps.pick.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # merge-base needs history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: static checks
        id: static
        run: |
          set -uo pipefail
          python -m pip install --quiet pyyaml
          python3 scripts/ci/check_static.py

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: hadolint
        run: python3 scripts/ci/check_static.py hadolint docker/npu/Dockerfile_aarch64

      - name: resolve image
        id: image
        env:
          OVERRIDE: ${{ vars.BASE_IMAGE_TAG }}
        run: |
          REF=$(python3 scripts/ci/build_image.py resolve --override "$OVERRIDE" \
            --fallback 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest')
          echo "image=$REF" >> "$GITHUB_OUTPUT"
          echo "image: $REF"

      # Labels -> flags live in select_plan.py; a copy here would be a second
      # definition of what ci:e2e means.
      - name: resolve plan
        id: pick
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          WITH_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.with_e2e }}
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all }}
        run: |
          set -uo pipefail
          # Empty diff (no history / no info) -> full run: fail-open on purpose.
          python3 scripts/ci/select_plan.py --changed-from git \
            --dump-changed /tmp/changed.txt \
            --mode "$CI_MODE" --labels "$LABELS" \
            --with-e2e "$WITH_E2E" --force-all "$FORCE_INPUT" \
            --explain --output /tmp/sel.json --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --image-ref '${{ steps.image.outputs.image }}'

          python3 scripts/ci/select_plan.py --self-test

      # Last and always(): outputs are still published when the job fails.
      - name: record stage
        id: stage
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          PICK_OUTCOME: ${{ steps.pick.outcome }}
        run: python3 scripts/ci/check_static.py stage

  # No matrix, no shards: either would put one box per entry on the graph.
  l1_cpu_unit:
    name: cpu-unit-tests
    needs: select
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.cpu_unit_run == 'true'
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 40

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        env:
          MODE: cpu
          RESULT_JSON: /tmp/ci-result.json
        run: |
          set -uo pipefail
          python3 scripts/ci/report_result.py init --file "$RESULT_JSON" \
            kind=pytest model_type=pytest-cpu-unit mode=cpu \
            runner_label="${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}"
          bash scripts/ci/install_deps.sh install

      - name: pytest
        env:
          MODE: cpu
          TEST_FILES: ${{ needs.select.outputs.cpu_unit_files }}
          TEST_PATH: ${{ inputs.test_path }}
          RESULT_JSON: /tmp/ci-result.json
        run: bash scripts/ci/run_tests.sh

      - name: summary
        if: always()
        env:
          RESULT_JSON: /tmp/ci-result.json
        run: |
          set -uo pipefail
          python3 scripts/ci/report_result.py report --file "$RESULT_JSON" \
            --train-log /tmp/pytest.log --junit /tmp/pytest.xml >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/ci/report_result.py notice --file "$RESULT_JSON" \
            --model-type pytest-cpu-unit || true

  # Containerised, and the whole lane runs once it starts: operators and images
  # are repo-wide, so running only the selected files proves nothing.
  l2_npu_unit:
    name: npu-unit-tests
    needs: select
    # Fork PRs get no secrets, and handing secrets to fork code is RCE.
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.npu_unit_run == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_NPU_RUNNER || 'linux-aarch64-a3-800i-2' }}
    timeout-minutes: 40

    container:
      image: ${{ needs.select.outputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: preflight
        env:
          RESULT_JSON: /tmp/ci-result.json
        run: |
          set -uo pipefail
          python3 scripts/ci/report_result.py init --file "$RESULT_JSON" \
            kind=pytest model_type=pytest-npu-unit mode=npu \
            runner_label="${{ vars.CI_NPU_RUNNER || 'linux-aarch64-a3-800i-2' }}" \
            image="${{ needs.select.outputs.image }}"

          # Snapshot torch first; a swapped torch looks like a code bug.
          python3 scripts/ci/env_pod.py capture --file /tmp/torch-before.json || true

          uname -m; nproc; free -h | head -2; df -h / | tail -1; python -V

      - name: npu self-check
        run: bash scripts/ci/run_train.sh probe

      - name: install
        env:
          MODE: npu
          RESULT_JSON: /tmp/ci-result.json
        run: bash scripts/ci/install_deps.sh install

      - name: pytest
        env:
          MODE: npu
          TEST_FILES: '[]'
          TEST_PATH: ${{ inputs.test_path }}
          RESULT_JSON: /tmp/ci-result.json
        run: bash scripts/ci/run_tests.sh

      - name: summary
        if: always()
        env:
          RESULT_JSON: /tmp/ci-result.json
        run: |
          set -uo pipefail
          python3 scripts/ci/report_result.py report --file "$RESULT_JSON" \
            --train-log /tmp/pytest.log --junit /tmp/pytest.xml >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/ci/report_result.py notice --file "$RESULT_JSON" \
            --model-type pytest-npu-unit || true

  # Profiles loop inside the job (run_train.sh lane): a matrix would put one box per
  # profile on the graph.
  l3_npu_model:
    name: npu-model-tests
    needs: select
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.npu_model_run == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_E2E_RUNNER || 'linux-aarch64-a3-800i-8' }}
    timeout-minutes: 45
    outputs:
      skip_reason: ${{ steps.lane.outputs.skip_reason }}

    container:
      image: ${{ needs.select.outputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # 20 s to find "no NPU" beats discovering it after installing deps.
      - name: npu and stack self-check
        run: bash scripts/ci/run_train.sh probe

      - name: train
        id: lane
        timeout-minutes: 25
        env:
          E2E_PROFILES: ${{ needs.select.outputs.e2e }}
          FRAMEWORK: lf
          RUNNER_LABEL: ${{ vars.CI_E2E_RUNNER || 'linux-aarch64-a3-800i-8' }}
          IMAGE: ${{ needs.select.outputs.image }}
          SEQ_LEN: '4096'
          DATASET_IN: 'gsm8k'
          FINETUNING_TYPE: 'full'
          FETCH_TIMEOUT: '600'
          DIAG: 'true'
          RESULT_JSON: /tmp/ci-result.json
        run: bash scripts/ci/run_train.sh lane

      # timeout-minutes only kills the process; children would keep the cards.
      - name: cleanup
        if: always()
        continue-on-error: true
        run: python3 scripts/ci/env_pod.py cleanup

  # Sole required check; the rules live in report_gate.py so pr/full cannot drift.
  # select is a direct dep: a failed plan skips the lanes in seconds.
  gate:
    name: gate
    needs: [select, l1_cpu_unit, l2_npu_unit, l3_npu_model]
    if: always()
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: timing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/report_gate.py timing

      - name: judge
        env:
          R_SEL: ${{ needs.select.result }}
          SEL_STAGE: ${{ needs.select.outputs.stage }}
          R_CPU_UNIT: ${{ needs.l1_cpu_unit.result }}
          R_NPU_UNIT: ${{ needs.l2_npu_unit.result }}
          R_NPU_MODEL: ${{ needs.l3_npu_model.result }}
          CPU_UNIT_RUN: ${{ needs.select.outputs.cpu_unit_run }}
          NPU_UNIT_RUN: ${{ needs.select.outputs.npu_unit_run }}
          NPU_MODEL_RUN: ${{ needs.select.outputs.npu_model_run }}
          SKIP_REASON: ${{ needs.l3_npu_model.outputs.skip_reason }}
          # Only the string is passed; report_gate.py decides what ci:e2e:strict means.
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          SUMMARY: ${{ needs.select.outputs.summary }}
        run: python3 scripts/ci/report_gate.py judge --mode "$CI_MODE"
