name: CI

# Sole entry point: mode=pr (gate a PR on the diff) or mode=full.
# Lanes are inlined -- a `uses:` job renders as "caller / callee" on the graph.
# l1_/l2_/l3_ prefixes pin the order (jobs sort by key, not by position).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      mode:
        description: 'pr = select from the diff, full = run everything'
        required: true
        default: 'pr'
        type: choice
        options:
          - pr
          - full
      force_all:
        description: 'pr only: run everything (same as the ci:full label)'
        required: false
        default: false
        type: boolean
      with_e2e:
        description: 'pr: path-selected E2E cases; full: every nightly E2E case'
        required: false
        default: false
        type: boolean
      test_path:
        description: "unit lanes only: dir / file / node id; '-' = normal selection"
        required: false
        default: '-'
        type: string

# A shared group with cancel-in-progress: false still cancels *pending* jobs and
# once wedged this queue. So: PRs cancel per PR, full runs never queue.
# ci:manual:* labels are ci-manual.yml's triggers; a separate group keeps the
# resulting no-op run from cancelling a real CI run.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('full-{0}', github.run_id) }}${{ startsWith(github.event.label.name || '', 'ci:manual:') && '-manual-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  actions: read          # gate timing reads created_at / run_started_at

env:
  # Not MODE: run_tests.sh reads MODE as cpu/npu.
  CI_MODE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.mode }}

jobs:
  select:
    name: lint-select
    # Lint and selection are strictly serial and together take seconds, so they
    # share one runner and one full checkout. Keep them in separate steps: a lint
    # failure then naturally prevents a plan, without another `needs` edge.
    # ci:manual:* exists to run one lane via ci-manual.yml. Without this guard a
    # manual label also starts a full CI run, which is both slow and confusing.
    if: ${{ !startsWith(github.event.label.name || '', 'ci:manual:') }}
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 20
    outputs:
      cpu_jobs: ${{ steps.plan.outputs.cpu_jobs || '[]' }}
      cpu_job_count: ${{ steps.plan.outputs.cpu_job_count || '0' }}
      npu_jobs: ${{ steps.plan.outputs.npu_jobs || '[]' }}
      npu_job_count: ${{ steps.plan.outputs.npu_job_count || '0' }}
      image: ${{ steps.image.outputs.image }}
      summary: ${{ steps.select.outputs.summary }}
      failed_step: ${{ steps.failed_step.outputs.failed_step }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # merge-base needs history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Generic linters run first, then TorchTurbo contracts. Keeping both in
      # one driver makes every finding visible in one pass; `--verify` for the
      # selector also runs here. Only ruff and PyYAML need installing up front;
      # shellcheck, actionlint and hadolint bootstrap themselves.
      - name: lint
        id: lint
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -uo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            -r requirements-lint.txt
          python3 scripts/ci/lint_select/lint_check.py

      - name: resolve image
        id: image
        env:
          OVERRIDE: ${{ vars.BASE_IMAGE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --repo enables the artifact lookup published by ci-image.yml.
          REF=$(python3 scripts/ci/image/build_image.py resolve --override "$OVERRIDE" \
            --repo "$GITHUB_REPOSITORY" \
            --fallback 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest')
          test -n "$REF"
          echo "image=$REF" >> "$GITHUB_OUTPUT"
          echo "image: $REF"

      # Labels -> flags live in select_tests.py; a copy here would be a second
      # definition of what ci:e2e means.
      - name: select
        id: select
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          WITH_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.with_e2e }}
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all }}
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          set -uo pipefail
          # Empty diff (no history / no info) -> full run: fail-open on purpose.
          python3 scripts/ci/lint_select/select_tests.py --changed-from git \
            --base-ref "$BASE_REF" \
            --dump-changed /tmp/changed.txt \
            --mode "$CI_MODE" --labels "$LABELS" \
            --with-e2e "$WITH_E2E" --force-all "$FORCE_INPUT" \
            --explain --output /tmp/sel.json --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --image-ref '${{ steps.image.outputs.image }}'

      # The plan aggregates work by (image, device), then chooses one capacity
      # lane for that device. Matrices therefore grow by image/device, not rank.
      - name: plan
        id: plan
        if: ${{ success() }}
        run: |
          set -euo pipefail
          python3 scripts/ci/plan.py --selection /tmp/sel.json \
            --output /tmp/plan.json --summary-file "$GITHUB_STEP_SUMMARY" \
            --test-path "${{ inputs.test_path }}" \
            --github-output "$GITHUB_OUTPUT"

      # Last and always(): outputs are still published when the job fails.
      - name: record failed step
        id: failed_step
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: python3 scripts/ci/report/report_gate.py failed-step

  # One matrix entry per CPU image from the plan. Dependencies are
  # isolated inside the job by venv, so model and framework count do not add boxes.
  l1_cpu_unit:
    name: cpu-unit-tests (${{ matrix.id }})
    needs: select
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.cpu_job_count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.cpu_jobs) }}
    runs-on: ${{ vars[matrix.runner_variable] || matrix.runner }}
    timeout-minutes: 40

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/ci/envs.toml
            scripts/ci/envs/*.txt

      - name: restore venv cache
        id: venv_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/turbo-ci-venv
          key: turbo-venv-${{ runner.os }}-${{ runner.arch }}-${{ matrix.id }}-py${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('scripts/ci/venv_manager.py', 'scripts/ci/common/env_pod.py') }}-${{ hashFiles('scripts/ci/envs.toml', 'scripts/ci/envs/**', 'pyproject.toml') }}
          # Reuse the newest compatible archive. VenvManager validates each
          # content-addressed profile and rebuilds only changed environments.
          restore-keys: |
            turbo-venv-${{ runner.os }}-${{ runner.arch }}-${{ matrix.id }}-py${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('scripts/ci/venv_manager.py', 'scripts/ci/common/env_pod.py') }}-

      - name: execute plan
        env:
          JOB: ${{ toJSON(matrix) }}
          RUNNER_LABEL: ${{ vars[matrix.runner_variable] || matrix.runner }}
          RESULT_JSON: ${{ runner.temp }}/ci-result.json
          CI_JOB_LOG: ${{ runner.temp }}/turbo-ci.log
          JUNIT_OUT: ${{ runner.temp }}/pytest.xml
          VERSIONS_OUT: ${{ runner.temp }}/versions.txt
          CI_VENV_ROOT: ${{ runner.temp }}/turbo-ci-venv
        run: python3 scripts/ci/run_job.py --job-json "$JOB"

      - name: summary
        if: always()
        env:
          RESULT_JSON: ${{ runner.temp }}/ci-result.json
        run: |
          set -uo pipefail
          python3 scripts/ci/report/report_result.py report --file "$RESULT_JSON" \
            --train-log "${{ runner.temp }}/turbo-ci.log" \
            --versions "${{ runner.temp }}/versions.txt" \
            --junit "${{ runner.temp }}/pytest.xml" >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/ci/report/report_result.py notice --file "$RESULT_JSON" \
            --model-type pytest-cpu-unit || true

      - name: save venv cache
        if: success() && steps.venv_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/turbo-ci-venv
          key: turbo-venv-${{ runner.os }}-${{ runner.arch }}-${{ matrix.id }}-py${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('scripts/ci/venv_manager.py', 'scripts/ci/common/env_pod.py') }}-${{ hashFiles('scripts/ci/envs.toml', 'scripts/ci/envs/**', 'pyproject.toml') }}

  # NPU unit and E2E are separate matrix entries. Each entry selects the
  # smallest lane that can hold its own process/card requirement.
  l2_npu:
    name: npu-tests (${{ matrix.id }})
    needs: select
    # Fork PRs get no secrets, and handing secrets to fork code is RCE.
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.npu_job_count != '0' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      # Each matrix entry is a separate job and pod. Two at most run together;
      # E2E cases never share a pod, so model state cannot leak across cases.
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.select.outputs.npu_jobs) }}
    runs-on: ${{ vars[matrix.runner_variable] || matrix.runner }}
    timeout-minutes: 360
    outputs:
      skip_reason: ${{ steps.execute.outputs.skip_reason }}

    container:
      image: ${{ needs.select.outputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: preflight
        env:
          RESULT_JSON: /tmp/ci-result.json
        run: |
          set -uo pipefail
          python3 scripts/ci/report/report_result.py init --file "$RESULT_JSON" \
            kind=pytest model_type=pytest-npu-unit mode=npu job_id="${{ matrix.id }}" \
            runner_label="${{ vars[matrix.runner_variable] || matrix.runner }}" \
            image="${{ needs.select.outputs.image }}"

          uname -m; nproc; free -h | head -2; df -h / | tail -1; python -V

      - name: environment check
        run: python3 scripts/ci/common/env_pod.py probe --file /tmp/torch-before.json

      - name: execute plan
        id: execute
        env:
          JOB: ${{ toJSON(matrix) }}
          RUNNER_LABEL: ${{ vars[matrix.runner_variable] || matrix.runner }}
          IMAGE: ${{ needs.select.outputs.image }}
          RESULT_JSON: /tmp/ci-result.json
          CI_JOB_LOG: /tmp/turbo-ci.log
          JUNIT_OUT: /tmp/pytest.xml
          VERSIONS_OUT: /tmp/versions.txt
          CI_VENV_ROOT: /tmp/turbo-ci-venv
          SEQ_LEN: '4096'
          DATASET_IN: 'gsm8k'
          FINETUNING_TYPE: 'full'
        run: python3 scripts/ci/run_job.py --job-json "$JOB"

      - name: summary
        if: always()
        env:
          RESULT_JSON: /tmp/ci-result.json
        run: |
          set -uo pipefail
          python3 scripts/ci/report/report_result.py report --file "$RESULT_JSON" \
            --train-log /tmp/turbo-ci.log --versions /tmp/versions.txt \
            --junit /tmp/pytest.xml >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/ci/report/report_result.py notice --file "$RESULT_JSON" \
            --model-type pytest-npu-unit || true

      # timeout-minutes only kills the process; children would keep the cards.
      - name: environment cleanup
        if: always()
        continue-on-error: true
        run: python3 scripts/ci/common/env_pod.py cleanup

  # Sole required check; the rules live in report_gate.py so pr/full cannot drift.
  # select is a direct dep: a failed plan skips the lanes in seconds.
  gate:
    name: gate
    needs: [select, l1_cpu_unit, l2_npu]
    # always() so lanes' results are judged even when select failed; the label
    # guard mirrors select, or a manual-label run would judge an empty plan.
    if: ${{ always() && !startsWith(github.event.label.name || '', 'ci:manual:') }}
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: timing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/report/report_gate.py timing

      - name: judge
        env:
          R_SEL: ${{ needs.select.result }}
          SEL_FAILED_STEP: ${{ needs.select.outputs.failed_step }}
          R_CPU: ${{ needs.l1_cpu_unit.result }}
          R_NPU: ${{ needs.l2_npu.result }}
          CPU_RUN: ${{ needs.select.outputs.cpu_job_count != '0' }}
          NPU_RUN: ${{ needs.select.outputs.npu_job_count != '0' }}
          SKIP_REASON: ${{ needs.l2_npu.outputs.skip_reason }}
          # Only the string is passed; report_gate.py decides what ci:e2e:strict means.
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          SUMMARY: ${{ needs.select.outputs.summary }}
        run: python3 scripts/ci/report/report_gate.py judge --mode "$CI_MODE"
