name: Ascend-Nightly-CI
run-name: Ascend-Nightly-CI ${{ github.ref_name }}

# Full unit + nightly E2E run. Reuses the main CI graph in ascend-pr.yml.
# Automatic scheduling is intentionally disabled for now.
on:
  # schedule:
  #   - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  nightly:
    name: Ascend-Nightly-Full
    uses: ./.github/workflows/ascend-pr.yml
    with:
      mode: full
      with_e2e: true
    secrets: inherit
