name: Ascend-Image-Pipeline
run-name: Ascend-Image-Pipeline ${{ inputs.image }} (${{ inputs.image_mode }})

# One logical image's complete pipeline. The parent workflow expands this as a
# matrix so different Dockerfiles run independently without global barriers.
#
#   build_if_missing  -> build candidate -> candidate tests
#   resolve_candidate -> resolve candidate -> promote alias
#
# This workflow owns one image only. The image identity/build/resolve primitive
# stays in ascend-image.yml, so other entry points can reuse it without tests.

on:
  workflow_call:
    inputs:
      image:
        description: 'Logical image name from resources.images'
        required: true
        type: string
      image_mode:
        description: 'build_if_missing (validation) or resolve_candidate (promotion)'
        required: true
        type: string
      target:
        description: 'Target slice used by candidate tests; optional for promotion'
        required: false
        default: ''
        type: string
      image_plan:
        description: 'Precomputed compact ImagePlan JSON from the image PR Plan'
        required: false
        default: ''
        type: string
      content_tag:
        description: 'Precomputed content tag used for build concurrency'
        required: false
        default: ''
        type: string
      checkout_ref:
        description: 'Git ref under test; empty uses the calling workflow SHA'
        required: false
        default: ''
        type: string
      max_jobs:
        description: 'MAX_JOBS passed to the image builder'
        required: false
        default: 'auto'
        type: string
      use_cache:
        description: 'Use the GitHub Actions build cache'
        required: false
        default: true
        type: boolean
    secrets:
      SWR_USERNAME:
        required: false
      SWR_PASSWORD:
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  build:
    name: Ascend-Image-Build (${{ inputs.image }})
    uses: ./.github/workflows/ascend-image.yml
    with:
      image: ${{ inputs.image }}
      mode: ${{ inputs.image_mode }}
      image_plan: ${{ inputs.image_plan }}
      content_tag: ${{ inputs.content_tag }}
      checkout_ref: ${{ inputs.checkout_ref }}
      max_jobs: ${{ inputs.max_jobs }}
      use_cache: ${{ inputs.use_cache }}
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}

  tests:
    name: Ascend-Image-Tests (${{ inputs.image }})
    if: inputs.image_mode == 'build_if_missing' && !startsWith(inputs.image, 'mock-')
    needs: build
    uses: ./.github/workflows/ascend-pr.yml
    with:
      mode: pr
      scope: pull_request
      targets: ${{ inputs.target }}
      checkout_ref: ${{ inputs.checkout_ref }}
      image_name: ${{ inputs.image }}
      image_ref: ${{ needs.build.outputs.ref }}

  mock_verify:
    name: Ascend-Image-Mock-Verify (${{ inputs.image }})
    if: inputs.image_mode == 'build_if_missing' && startsWith(inputs.image, 'mock-')
    needs: build
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    steps:
      - name: log in to SWR
        env:
          SWR_USER: ${{ secrets.SWR_USERNAME }}
          SWR_PASS: ${{ secrets.SWR_PASSWORD }}
          REGISTRY: ${{ vars.SWR_REGISTRY || 'swr.cn-north-12.myhuaweicloud.com' }}
        run: |
          set -euo pipefail
          if [ -z "${SWR_USER:-}" ] || [ -z "${SWR_PASS:-}" ]; then
            echo "::error::SWR_USERNAME / SWR_PASSWORD are required to verify a candidate"
            exit 1
          fi
          printf '%s' "$SWR_PASS" | docker login "$REGISTRY" -u "$SWR_USER" --password-stdin

      - name: verify mock candidate identity
        env:
          IMAGE: ${{ inputs.image }}
          REF: ${{ needs.build.outputs.ref }}
          CONTENT_TAG: ${{ needs.build.outputs.content_tag }}
        run: |
          set -euo pipefail
          case "$IMAGE:$CONTENT_TAG" in
            mock-*:cann*-mock-*) ;;
            *)
              echo "::error::refusing non-mock candidate verification for $IMAGE:$CONTENT_TAG"
              exit 1
              ;;
          esac
          docker pull "$REF" >/dev/null
          labels=$(docker image inspect --format '{{json .Config.Labels}}' "$REF")
          LABELS="$labels" python3 - <<'PY'
          import json
          import os
          import sys

          labels = json.loads(os.environ["LABELS"]) or {}
          expected = {
              "org.torchturbo.ci.mock": "true",
              "org.torchturbo.ci.purpose": "image-pipeline-orchestration-only",
          }
          for key, value in expected.items():
              if labels.get(key) != value:
                  print(f"::error::mock image label {key}={labels.get(key)!r}, expected {value!r}")
                  sys.exit(1)
          print("MOCK ONLY: candidate identity and labels verified")
          PY

      - name: summary
        if: always()
        env:
          IMAGE: ${{ inputs.image }}
          CONTENT_TAG: ${{ needs.build.outputs.content_tag }}
          REF: ${{ needs.build.outputs.ref }}
        run: |
          {
            echo '## MOCK ONLY image verification'
            echo ''
            echo 'This run exercised image orchestration only. No NPU test or training was executed.'
            echo ''
            echo '| field | value |'
            echo '|---|---|'
            echo "| image | \`${IMAGE}\` |"
            echo "| content tag | \`${CONTENT_TAG}\` |"
            echo "| candidate ref | \`${REF}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Ascend-Image-Promote-Alias (${{ inputs.image }})
    if: inputs.image_mode == 'resolve_candidate'
    needs: build
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install CI dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check -r requirements-lint.txt

      - name: check registry tooling
        run: python3 -m scripts.ci.image env

      - name: log in to SWR
        env:
          SWR_USER: ${{ secrets.SWR_USERNAME }}
          SWR_PASS: ${{ secrets.SWR_PASSWORD }}
          REGISTRY: ${{ vars.SWR_REGISTRY || 'swr.cn-north-12.myhuaweicloud.com' }}
        run: |
          set -euo pipefail
          if [ -z "${SWR_USER:-}" ] || [ -z "${SWR_PASS:-}" ]; then
            echo "::error::SWR_USERNAME / SWR_PASSWORD are required to promote an image"
            exit 1
          fi
          printf '%s' "$SWR_PASS" | docker login "$REGISTRY" -u "$SWR_USER" --password-stdin

      - name: promote validated digest
        id: promote
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 -m scripts.ci.image promote \
            --image "$IMAGE" \
            --digest "$DIGEST" \
            --github-output "$GITHUB_OUTPUT"

      - name: summary
        if: always()
        env:
          IMAGE: ${{ inputs.image }}
          ALIAS: ${{ steps.promote.outputs.alias }}
          CONTENT_TAG: ${{ steps.promote.outputs.content_tag }}
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          {
            echo '## Image promotion'
            echo ''
            echo '| field | value |'
            echo '|---|---|'
            echo "| image | \`${IMAGE}\` |"
            echo "| alias | \`${ALIAS:-missing}\` |"
            echo "| content tag | \`${CONTENT_TAG:-missing}\` |"
            echo "| digest | \`${DIGEST:-missing}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
