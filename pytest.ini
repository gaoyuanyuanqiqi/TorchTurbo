; Test configuration lives here, not in pyproject.toml.
;
; pytest resolves its config from ONE file, first match wins: pytest.ini >
; pyproject.toml [tool.pytest.ini_options] > tox.ini > setup.cfg. Keeping a
; [tool.pytest.ini_options] section in pyproject.toml would therefore be dead
; config, silently ignored.
;
; pyproject.toml stays packaging-only; this file owns how tests are collected,
; imported, and marked. `lint_check.py --only markers` asserts the markers
; below and the device markers in lint_select/select_tests.py agree.

[pytest]
testpaths = tests
pythonpath = src

; A typo in a marker name fails instead of silently selecting nothing.
; Do not put -m here: each lane selects its own set explicitly.
addopts = --strict-markers

markers =
    cpu: runs in the CPU lane
    npu: requires Ascend NPU; minimum 1 card
    rank_2: needs at least 2 processes or accelerator cards
    rank_4: needs at least 4 processes or accelerator cards
    rank_8: needs at least 8 processes or accelerator cards
    integration: requires a real framework, checkpoint, dataset, or network
