e2e_defaults:
  # Timeout caps for every E2E case. Cold model downloads can exceed 47 GiB.
  fetch_timeout: 1800
  case_timeout: 7200

lanes:
  # One lane per (image, device, runner capacity). Work aggregates before a lane
  # is chosen, so processes/cards are requirements, not job keys.
  default/cpu:
    image: default
    device: cpu
    slots: 8
    resource: cpu
    runner_variable: CI_CPU_RUNNER
    runner: ubuntu-22.04-arm
  default/npu-2:
    image: default
    device: npu
    slots: 2
    runner_variable: CI_NPU_RUNNER
    runner: linux-aarch64-a3-800i-2
  default/npu-8:
    image: default
    device: npu
    slots: 8
    runner_variable: CI_E2E_RUNNER
    runner: linux-aarch64-a3-800i-8
