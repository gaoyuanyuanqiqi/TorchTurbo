resources:
  targets:
    cpu:
      device: cpu
    npu-a3:
      device: npu
      hardware: a3

  images:
    cpu-default:
      target: cpu
      kind: host
      ref: python:3.11

    npu-a3-cann90:
      target: npu-a3
      kind: container
      build:
        dockerfile: docker/npu/Dockerfile_aarch64
        platform: linux/arm64
        revision: 1
        ci_build_args:
          GIT_HTTP_USER_AGENT: git/2.56.1
      publish:
        ref: swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:cann9.0.0-a3-base

  runners:
    - target: cpu
      rank_capacity: 8
      runs_on:
        variable: CI_CPU_RUNNER
        fallback: ubuntu-22.04-arm
    - target: npu-a3
      rank_capacity: 2
      runs_on:
        variable: CI_NPU_2_RUNNER
        fallback: linux-aarch64-a3-800i-2
      container_options: --user root
    - target: npu-a3
      rank_capacity: 16
      runs_on:
        variable: CI_NPU_16_RUNNER
        fallback: linux-aarch64-a3-800i-16
      container_options: --user root

  venvs:
    default:
      python: "3.11"
      requirements: [scripts/ci/config/envs/default.txt]
    qwen4_exp:
      python: "3.11"
      requirements: [scripts/ci/config/envs/qwen4_exp.txt]
    lf:
      python: "3.11"
      requirements: [scripts/ci/config/envs/lf.txt]
    swift:
      python: "3.11"
      requirements: [scripts/ci/config/envs/swift.txt]
      overrides: [scripts/ci/config/envs/swift_overrides.txt]
    qwen4_exp_swift:
      python: "3.11"
      extends: swift

test_areas:
  pytest:
    defaults:
      job_timeout_minutes: {cpu: 40, npu: 90, gpu: 90}
      step_timeout_minutes: {cpu: 40, npu: 90, gpu: 90}
    model_venvs:
      qwen4_exp: qwen4_exp
    framework_venvs:
      lf: lf
      swift: swift
    combo_venvs:
      qwen4_exp+swift: qwen4_exp_swift
    overrides:
      tests/unit_tests/models/bailing_moe_v3_vl/test_lf_image_parity.py:
        venv: lf
      tests/unit_tests/models/bailing_moe_v3_vl/test_lf_integration.py:
        venv: lf
      tests/unit_tests/models/bailing_moe_v3_vl/test_lf_text_parity.py:
        venv: lf
      tests/unit_tests/models/bailing_moe_v3_vl/test_swift_integration.py:
        venv: swift

  integration:
    suites:
      base_suite:
        runner: tests/integration_tests/scripts/run_tests.py
        defaults:
          job_timeout_minutes: {cpu: 40, npu: 90, gpu: 90}
          step_timeout_minutes: {cpu: 40, npu: 90, gpu: 90}
        framework_venvs:
          swift: swift
          llamafactory: lf
        overrides:
          bailing_v3/sft_16npu:
            job_timeout_minutes: 480

scopes:
  pull_request:
    - test_areas:
        - pytest/core
        - pytest/adapter
        - integration/base_suite/qwen3_5_moe/sft_2cpu
      environment:
        image: cpu-default
    - test_areas:
        - pytest/core
        - integration/base_suite/qwen3_5_moe/sft_2npu
      environment:
        image: npu-a3-cann90

  nightly:
    - environment:
        image: cpu-default
    - test_areas:
        - pytest/core
        - pytest/model
        - integration/base_suite/qwen3_5_moe/sft_2npu
        - integration/base_suite/bailing_v3/sft_16npu
      environment:
        image: npu-a3-cann90
